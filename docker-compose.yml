services:
  # ==========================
  # Kafka Cluster - KRaft (3 brokers)
  # ==========================
  broker1:
    image: confluentinc/cp-kafka:8.1.0
    container_name: broker1
    hostname: broker1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093,3@broker3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_REPLICA_FETCH_MAX_BYTES: 20971520
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 20971520
    ports:
      - "9092:9092"
    volumes:
      - broker1_data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker1:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  broker2:
    image: confluentinc/cp-kafka:8.1.0
    container_name: broker2
    hostname: broker2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093,3@broker3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_REPLICA_FETCH_MAX_BYTES: 20971520
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 20971520
    ports:
      - "9093:9092"
    volumes:
      - broker2_data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker2:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  broker3:
    image: confluentinc/cp-kafka:8.1.0
    container_name: broker3
    hostname: broker3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093,3@broker3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_REPLICA_FETCH_MAX_BYTES: 20971520
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 20971520
    ports:
      - "9094:9092"
    volumes:
      - broker3_data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker3:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ==========================
  # Init Topics
  # ==========================
  init-topics:
    image: confluentinc/cp-kafka:8.1.0
    container_name: kafka-init-topics
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "/scripts/init-topics.sh"]
    volumes:
      - ./init-topics.sh:/scripts/init-topics.sh:ro
    networks:
      - kafka-net
    restart: "no"

  # ==========================
  # Kafka UI (opcional)
  # ==========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - broker1
      - broker2
      - broker3
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:9092,broker2:9092,broker3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    ports:
      - "8081:8080"
    networks:
      - kafka-net

  # ==========================
  # Producer (Python FastAPI)
  # ==========================
  producer:
    build:
      context: ./kafka-video-producer
    container_name: kafka-producer
    env_file:
      - .env
    depends_on:
      - init-topics
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    networks:
      - kafka-net
    restart: on-failure

  # ==========================
  # Consumer (Python)
  # ==========================
  consumer:
    build:
      context: ./kafka-video-consumer
    container_name: kafka-consumer
    env_file:
      - .env
    depends_on:
      - init-topics
    command: ["python", "consumer.py"]
    networks:
      - kafka-net
    restart: on-failure

# ==========================
# Volúmenes y red
# ==========================
volumes:
  broker1_data:
  broker2_data:
  broker3_data:

networks:
  kafka-net:
    name: kafka-net
    driver: bridge
