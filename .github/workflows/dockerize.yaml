name: Deploy EventsService to DockerHub

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: events_service
  DOCKERHUB_REPO: dase123/udlaia-stats

jobs:
  bandit:
      runs-on: ubuntu-latest
      name: Análisis de seguridad con Bandit
      steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: 3.13

        - name: Instalar Bandit
          run: pip install bandit[toml]

        - name: Ejecutar Bandit
          run: |
            bandit -r . -f json -o bandit-report.json
            if bandit -r . -f json | jq '.results[] | select(.issue_severity=="HIGH")' | grep -q .; then exit 1; fi

        - name: Subir reporte como artefacto
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: bandit-report
            path: bandit-report.json

  deploy:
    needs: bandit
    runs-on: ubuntu-latest
    name: Construir y desplegar microservicio en docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Construir imagen con docker-compose
        run: |
          cat > .env << 'EOF'
          KAFKA_GROUP_ID=${{ secrets.KAFKA_GROUP_ID }}
          KAFKA_BROKER=${{ secrets.KAFKA_BROKER }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          PLAYERS_ENDPOINT=${{ secrets.PLAYERS_ENDPOINT }}
          TEAM_SERVICE=${{ secrets.TEAM_SERVICE }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          EOF
          docker-compose --env-file .env build web

      - name: Etiquetar imagen
        run: |
          docker tag kafka-service:latest ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_NAME }}

      - name: Push a DockerHub
        run: |
          docker push ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_NAME }}

      - name: Mostrar imágenes subidas
        run: docker buildx imagetools inspect ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_NAME }}